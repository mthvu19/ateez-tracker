name: Update X (10h & 18h VN)

# X API tinh phi theo so bai doc -> chi quet 2 lan/ngay: 03:00 va 11:00 UTC = 10:00 va 18:00 gio VN.
on:
  schedule:
    - cron: "0 3,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Thu thap
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.run --sources x
      - name: Luu du lieu
        run: |
          git config user.name "ateez-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: cap nhat $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push

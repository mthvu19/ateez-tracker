<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17181C">
<title>ATEEZ Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#today" aria-label="ATEEZ Tracker – Today">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="12" stroke="#F2B544" stroke-width="2.5"/><path d="M8 18 L14 8 L20 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ATEEZ Tracker</span>
    </a>
    <span class="today-date" id="todayDate"></span>
    <div class="top-right">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9CBD2" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sr">Search</span>
        <input type="search" id="search" placeholder="Search news, members, events…" autocomplete="off">
      </label>
      <span class="updated" id="updated"><span class="dot"></span><span id="updatedText">Loading…</span></span>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="side" aria-label="Menu">
    <div class="menu" id="menu"></div>
    <div class="side-block">
      <span class="eyebrow">Members</span>
      <div class="pills" id="memberPills"></div>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1"></main>

  <aside class="aside" id="aside"></aside>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>

<script src="app.js"></script>
</body>
</html>
